{{/* 自定义：窄屏下滚动方向感知的导航自动显隐。
     向下滚动时给根元素加 scroll-down class（配合 accent.css 隐藏品牌/菜单），
     向上滚动时移除。仅在 ≤768px 有媒体查询规则生效，桌面端无影响。 */}}
<script>
    (() => {
        let lastY = window.scrollY;
        const threshold = 8; // 忽略微小抖动

        window.addEventListener('scroll', () => {
            const y = window.scrollY;
            if (Math.abs(y - lastY) < threshold) return;
            // 页首始终显示；向下滚隐藏，向上滚显示
            document.documentElement.classList.toggle('scroll-down', y > lastY && y > 60);
            lastY = y;
        }, { passive: true });
    })();
</script>

{{/* Mermaid 图表：页面存在 .mermaid 容器时才动态加载库（jsDelivr，国内可达），
     避免全站引入大体积 JS；主题跟随亮/暗模式 */}}
<script type="module">
    if (document.querySelector('.mermaid')) {
        const { default: mermaid } = await import('https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs');
        mermaid.initialize({
            startOnLoad: true,
            theme: document.documentElement.dataset.theme === 'dark' ? 'dark' : 'neutral'
        });
    }
</script>
